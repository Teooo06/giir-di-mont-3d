<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<title>Lower-Third Mockup — Giir di Mont</title>
<style>
:root{--accent-neon:#dff654;--card-bg:rgba(14,20,23,0.92);--border-subtle:rgba(255,255,255,0.12)}
body{margin:0;background:#0a0f12;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Barlow Condensed',sans-serif}
.lower-third{width:80%;max-width:900px;height:80px;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--card-bg);border:1px solid var(--border-subtle);border-radius:6px;backdrop-filter:blur(12px);border-top:4px solid var(--accent-neon);color:#f7f5ec}
.flag{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:28px;background:rgba(255,255,255,0.06);border-radius:4px}
.avatar{width:60px;height:60px;border-radius:50%;background:#223d2e;display:flex;align-items:center;justify-content:center;font:700 20px sans-serif;color:#fff;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.info{flex:1}
.info strong{display:block;font:700 18px/1 'Barlow Condensed',sans-serif;letter-spacing:.02em}
.info small{font:700 12px 'DM Sans',sans-serif;color:#aab;text-transform:uppercase}
.gap{font:700 14px monospace;color:#fff}
.pace{font:600 12px 'DM Sans',sans-serif;color:#cfd6cd}
</style>
</head>
<body>
<div style="position:fixed;inset:0;background:linear-gradient(to top,#1a2a33,#94b5c7)"></div>
<div style="position:fixed;bottom:10%;left:10%;width:80%;display:flex;flex-direction:column;gap:12px">
  <div class="lower-third">
    <div class="flag">🇮🇹</div>
    <div class="avatar"><img src="https://i.pravatar.cc/60?u=241" alt=""/></div>
    <div class="info"><strong>Morven Goodrum</strong><small>ITA · Scarpa Team</small></div>
    <div class="gap">LEADER</div>
    <div class="pace">5:42 min/km</div>
  </div>
  <div class="lower-third">
    <div class="flag">🇪🇷</div>
    <div class="avatar" style="background:#ff3b30">PM</div>
    <div class="info"><strong>Petro Mamu</strong><small>ERI · Scarpa</small></div>
    <div class="gap">+02:40</div>
    <div class="pace">6:18 min/km</div>
  </div>
  <div class="lower-third" style="opacity:0.55">
    <div class="flag">🇬🇧</div>
    <div class="avatar">MG</div>
    <div class="info"><strong>Tom Evans</strong><small>GBR · Adidas</small></div>
    <div class="gap">DNF</div>
    <div class="pace">--</div>
  </div>
</div>
</body>
</html>
