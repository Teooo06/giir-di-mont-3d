<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Controller</title>
    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      html,body{height:100%;width:100%;overflow:hidden;background:#0a0f11;color:#e8f0f2;font-family:system-ui,sans-serif;touch-action:none;overscroll-behavior:none}
      .app{height:100vh;height:100dvh;width:100vw;display:flex;flex-direction:column}
      .top{height:36px;background:#11191b;border-bottom:1px solid #1e2e33;display:flex;align-items:center;gap:8px;padding:0 10px;flex-shrink:0}
      .btn{appearance:none;border:1px solid #2a3a3f;background:#1a262a;color:#dff654;padding:6px 12px;border-radius:6px;font:700 12px system-ui;cursor:pointer;white-space:nowrap}
      .btn.active{background:#dff654;color:#0a0f11;border-color:#dff654}
      .btn:active{transform:scale(.97)}
      .status{font:10px monospace;opacity:.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .spacer{flex:1}
      .main{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;min-height:0}
      .joy-wrap{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px}
      .joy{width:min(26vh,180px);height:min(26vh,180px);width:min(42vw,180px);height:min(42vw,180px);max-width:170px;max-height:170px;border-radius:50%;background:radial-gradient(circle at 30% 30%, #162024, #0a0f11);border:2px solid #1e2e33;position:relative;touch-action:none}
      .joy::after{content:'';position:absolute;inset:16%;border:1px dashed #1e2e33;border-radius:50%;pointer-events:none}
      .stick{position:absolute;left:50%;top:50%;width:36%;height:36%;margin:-18% 0 0 -18%;border-radius:50%;background:radial-gradient(circle at 30% 30%, #dff654, #8a9a00);border:2px solid #0a0f11;box-shadow:0 2px 8px rgba(0,0,0,.6)}
      .center{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;max-width:420px;padding:0 6px}
      .row{display:flex;gap:6px}
      .row .btn{flex:1;padding:6px 4px;font-size:11px;min-width:0}
      .sliders{display:flex;flex-direction:column;gap:6px;background:#0f1719;border:1px solid #1a2a2e;border-radius:8px;padding:8px}
      .sliders label{font:600 10px monospace;opacity:.7;display:flex;align-items:center;gap:6px}
      .sliders input[type=range]{flex:1;accent-color:#dff654;height:22px}
      .sliders b{font:10px monospace;min-width:36px;text-align:right}
      @media (orientation:portrait){
        .main{flex-direction:column;justify-content:center;gap:10px;padding:10px}
        .joy{width:min(38vw,160px);height:min(38vw,160px)}
        .center{max-width:100%;width:100%}
      }
      @media (max-height:420px){
        .top{height:32px}
        .joy{width:130px;height:130px}
        .sliders{padding:6px;gap:4px}
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="top">
        <button id="btn-activate" class="btn">▶️ Attiva</button>
        <span id="status" class="status">disconnesso</span>
        <span class="spacer"></span>
        <label style="font:10px monospace;opacity:.7;display:flex;align-items:center;gap:4px;">SPEED <input id="speed-slider" type="range" min="0.3" max="2.5" step="0.1" value="1.0" style="width:80px;accent-color:#dff654;"><b id="speed-val" style="font:10px monospace;min-width:24px">1.0×</b></label>
      </div>

      <div class="main">
        <div class="joy-wrap">
          <div id="joy-left" class="joy"><div id="stick-left" class="stick"></div></div>
        </div>

        <div class="center">
          <div class="row">
            <button data-scene="overview" class="btn">1</button>
            <button data-scene="runner" class="btn">2</button>
            <button data-scene="checkpoint" class="btn">3</button>
            <button data-scene="topdown" class="btn">4</button>
          </div>
          <div class="sliders">
            <label>ZOOM <input id="zoom-slider" type="range" min="40" max="2600" step="10" value="400"><b id="zoom-val">400</b></label>
            <label>TIMELINE <input id="timeline-slider" type="range" min="0" max="32" step="0.1" value="0"><b id="timeline-val">0.0</b></label>
          </div>
          <div class="row">
            <button id="btn-play" class="btn" style="flex:1;">⏯️ Play</button>
            <span id="host-mini" style="font:9px monospace;opacity:.4;align-self:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px;"></span>
          </div>
        </div>

        <div class="joy-wrap">
          <div id="joy-right" class="joy"><div id="stick-right" class="stick"></div></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/controller.js"></script>
  </body>
</html>
